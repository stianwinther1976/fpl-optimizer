# Is the live site up, is the current commit actually serving it, and is Vercel
# Web Analytics switched on?
#
# The sandbox this repo is developed from can reach github.com but NOT
# fploptimize.com — `curl` returns `CONNECT tunnel failed, 403`, the same wall
# that puts every FPL probe on a runner. So this answers from a runner and
# reports through the job log. It publishes nothing and needs no secret.
#
# What it CANNOT answer is how many people visited. That needs the Vercel API
# and a token, which only the account owner can issue; see the closing note the
# job prints.
name: Site check

on:
  workflow_dispatch:
  push:
    branches: [site-check]

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AT JOB LEVEL ON PURPOSE. The `secrets` context is not available in a
    # step's `if`, so gating the traffic step on `secrets.VERCEL_TOKEN` there
    # does not evaluate to what it looks like it evaluates to. `env` IS
    # available in a step `if`, so the secret is mapped here and the step tests
    # the mapped value.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        # Full history: the analytics check below reads the layout out of the
        # commit the site is actually serving, which a shallow clone does not
        # have.
        with:
          fetch-depth: 0

      - name: Check the live site
        env:
          SITE: ${{ vars.SITE_URL || 'https://fploptimize.com' }}
        run: |
          set -u
          echo "site: $SITE"
          echo

          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' -L "$SITE/" || echo 000)
          echo "homepage                       : HTTP $code"

          # WHERE THE REQUEST ACTUALLY LANDS. The apex answers 308 and
          # redirects, so an un-followed request returns the redirect's own
          # body — the first run of this job printed "Redirecting..." as the
          # deployed commit and read a 308 on the script below as "not
          # enabled". Both were artefacts of the missing -L, not findings.
          echo -n "homepage resolves to           : "
          curl -sS -o /dev/null -w '%{url_effective}\n' -L "$SITE/"

          # Which commit is actually serving. A page whose build predates a
          # merge means the deploy has not landed yet, and every other line
          # below would then be describing the OLD build.
          echo -n "deployed commit (/api/version): "
          curl -sS -L "$SITE/api/version" || echo "(unreachable)"
          echo
          echo "this workflow's commit         : $GITHUB_SHA"
          echo

          # DOES THE CODE ACTUALLY SERVING THE SITE CARRY THE TAG?
          #
          # This used to grep the homepage HTML for `_vercel/insights` and
          # report "NO — the build predates it". That answer was fixed: the
          # component is `"use client"`, so it injects its script after
          # hydration and the server-rendered HTML can NEVER contain it. The
          # check could only ever say NO, and it said it about a build that
          # did contain the tag.
          #
          # So ask the repository instead. `/api/version` gives the commit the
          # site is serving; reading the layout out of THAT commit answers the
          # question exactly, and keeps answering it if the file moves.
          sha=$(curl -sS -L "$SITE/api/version" | sed -n 's/.*"v":"\([^"]*\)".*/\1/p')
          if [ -z "$sha" ]; then
            echo "analytics tag in deployed code : unknown — no commit from /api/version"
          elif ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "analytics tag in deployed code : unknown — $sha is not in this clone"
          elif git show "$sha:src/app/layout.tsx" 2>/dev/null | grep -q '<Analytics'; then
            echo "analytics tag in deployed code : YES (commit ${sha:0:7})"
          else
            echo "analytics tag in deployed code : NO — commit ${sha:0:7} predates it"
          fi

          # THE ACTUAL QUESTION. Vercel serves this script only once Web
          # Analytics is enabled for the project; until then it 404s and the
          # component collects nothing. So this distinguishes "the code shipped"
          # from "the switch is on", which no amount of reading the repo can.
          s=$(curl -sS -o /dev/null -w '%{http_code}' -L "$SITE/_vercel/insights/script.js" || echo 000)
          echo "/_vercel/insights/script.js    : HTTP $s (after redirects)"
          if [ "$s" = "200" ]; then
            echo "  -> Web Analytics is ENABLED and collecting."
          else
            echo "  -> Web Analytics is NOT enabled yet."
            echo "     Vercel dashboard -> the project -> Analytics -> Enable."
            echo "     Nothing is being counted until that switch is on, and it"
            echo "     does not backfill: the record starts the moment it flips."
          fi
          echo

      # Visitor numbers, IF a token has been added. Skipped entirely without
      # one, so the job above keeps working for anybody who never adds it.
      #
      # THE TOKEN IS NEVER PRINTED AND NEVER LEAVES THE RUNNER. It is read from
      # the repository secret straight into a header. It belongs in GitHub's
      # secret store and nowhere else — not in a chat message, not in a commit,
      # not in a log line.
      - name: Read the traffic numbers
        if: env.VERCEL_TOKEN != ''
        env:
          PROJECT: ${{ vars.VERCEL_PROJECT || 'fpl-optimizer' }}
          TEAM: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          set -u
          api() {
            curl -sS -w '\n<<HTTP %{http_code}>>' \
              -H "Authorization: Bearer $VERCEL_TOKEN" "$1"
          }
          q=""
          [ -n "${TEAM:-}" ] && q="?teamId=$TEAM"

          # STEP 1: prove the token works, against an endpoint that is
          # documented and stable. If this fails, nothing below means anything
          # and the failure is about the token, not about analytics.
          echo "--- whoami (is the token valid?) ---"
          api "https://api.vercel.com/v2/user" | head -c 400
          echo; echo

          echo "--- the project ---"
          api "https://api.vercel.com/v9/projects/$PROJECT$q" | head -c 600
          echo; echo

          # STEP 2: the actual numbers, and this part is DELIBERATELY WRITTEN AS
          # A QUESTION RATHER THAN AN ANSWER.
          #
          # Vercel's Web Analytics figures are what the dashboard renders, and
          # nothing has verified here that they are exposed on a stable public
          # REST route. Building a reporter on an endpoint nobody has called
          # would be inventing an API and then trusting it — the exact habit
          # CLAUDE.md bans. So this prints the raw response, status code
          # included, and the next run decides what to do with it.
          from=$(( ($(date +%s) - 7*24*3600) * 1000 ))
          to=$(( $(date +%s) * 1000 ))
          sep="&"; [ -z "$q" ] && sep="?"
          echo "--- web analytics, last 7 days (UNVERIFIED ENDPOINT) ---"
          api "https://api.vercel.com/v1/web-analytics/timeseries$q${sep}projectId=$PROJECT&from=$from&to=$to" | head -c 1200
          echo; echo
          echo "A 404 here is a finding, not a failure: it means the numbers are"
          echo "dashboard-only and this step should be replaced rather than"
          echo "retried. Read what came back before changing anything." 
