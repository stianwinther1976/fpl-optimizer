# Measure how the live FPL feeds actually tick. Publishes nothing.
#
# Same handle as the snapshot workflow next door, and for the same reason: the
# sandbox this repo is developed from can reach github.com but NOT
# fantasy.premierleague.com, so "push a branch" is the only trigger it has.
# The findings come back through the job log.
#
# Run it WHILE A MATCH IS IN PLAY or it has nothing to measure — it prints
# "nothing in play" and exits.
name: FPL clock probe

on:
  push:
    branches: [data-snapshot]
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip the long score probe, so the log is readable in a minute"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fpl-clock-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # The script bounds itself; this is only a backstop against a hung fetch.
    # The long probes total 22 minutes; a 20-minute cap cancelled the tail of
    # this job twice and ate the step that ran last.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # FIRST, and standalone: one request, and it answers a question that can
      # block a fix. A job's log cannot be downloaded until the job ENDS, so
      # anything quick has to run ahead of anything slow or it is not readable
      # for twenty minutes. That cost an afternoon once.
      - name: Check the standings subtraction
        env:
          FPL_LEAGUE_ID: ${{ vars.FPL_LEAGUE_ID || '314' }}
        run: node scripts/snapshot/standings-check.mjs

      # Second, and also standalone: one entry fetch, a handful of standings
      # pages and twenty entries — about half a minute, and it answers whether
      # the safety score is comparing the reader against his own rank band at
      # all. Same log-readability reason as the check above.
      - name: Check the safety score's rank band
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID || '946779' }}
          FPL_LEAGUE_ID: ${{ vars.FPL_LEAGUE_ID || '314' }}
        run: node scripts/snapshot/band-probe.mjs

      # Five minutes by default, twenty-two as configured. Run it while a match
      # WITH GOALS IN IT is actually going, or it has nothing to compare and
      # says so.
      #
      # `quick` exists because of the log-readability trap above: the two checks
      # ahead of this one answer in seconds, and a job's log cannot be
      # downloaded until the job ENDS. Without a way to skip this step, reading
      # a one-request answer costs twenty-two minutes of waiting.
      - name: Compare the fixtures score with the live-derived one
        if: ${{ !inputs.quick }}
        env:
          # Default five minutes. Raise it via the SCORE_RUN_MS repository
          # variable to cover a whole half when a match with goals is on.
          # 22 minutes: long enough to sit through a goal, short enough that
          # the job ends and its log becomes readable inside the 30-minute cap.
          SCORE_RUN_MS: ${{ vars.SCORE_RUN_MS || '1320000' }}
        run: node scripts/snapshot/score-probe.mjs

      # Opt-in, for the same log-readability reason: set the PROBE_LONG
      # repository variable to 'true'.
      - name: Probe the match clock
        if: vars.PROBE_LONG == 'true'
        run: node scripts/snapshot/clock-probe.mjs

      - name: Probe what a manager's score is reported as
        if: vars.PROBE_LONG == 'true'
        env:
          # Overridable so a specific team can be measured; the default is a
          # handful of low ids, which are real long-standing entries.
          FPL_ENTRY_IDS: ${{ vars.FPL_ENTRY_IDS || '1,2,3' }}
        run: node scripts/snapshot/entry-probe.mjs
