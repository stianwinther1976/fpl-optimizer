# Take a snapshot of the live FPL API and publish it on a data branch.
#
# Triggered by pushing to `data-snapshot` (and by hand via workflow_dispatch).
# The push trigger is the one that matters: the sandbox this repo is developed
# from can reach github.com but NOT fantasy.premierleague.com, and it cannot
# call the Actions API either, so "push a branch" is the only handle it has.
#
# Output goes to the `fpl-snapshot-out` branch, never to main and never back to
# `data-snapshot` — writing to the trigger branch would re-fire this workflow
# forever.
name: FPL snapshot

on:
  push:
    branches: [data-snapshot]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch snapshot
        run: node scripts/snapshot/fetch-snapshot.mjs

      - name: Publish to fpl-snapshot-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch, recreated each run. The snapshots are multi-megabyte
          # JSON and there is no reason to accumulate history of them; the sandbox
          # only ever wants the newest one.
          git checkout --orphan fpl-snapshot-out
          git rm -r --cached . >/dev/null
          git add -f snapshot/
          # Vercel deploys every push by default and does NOT honour [skip ci] in
          # the commit message — an earlier version of this file claimed it did,
          # and the result was a failed preview build on every snapshot run
          # ("Couldn't find any `pages` or `app` directory", because this tree is
          # data only). `git.deploymentEnabled` is the switch that actually works.
          # It is written here rather than inherited, because the orphan tree is
          # built from scratch and must carry its own copy.
          cat > vercel.json <<'JSON'
          {
            "git": {
              "deploymentEnabled": {
                "data-snapshot": false,
                "fpl-snapshot-out": false,
                "deadline-watch": false,
                "deadline-watch-out": false
              }
            }
          }
          JSON
          git add -f vercel.json
          # [skip ci] is kept for GitHub Actions' own skip convention, not Vercel's.
          git commit -m "FPL snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push --force origin fpl-snapshot-out
